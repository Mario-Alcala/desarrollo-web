<!DOCTYPE html>
<!--
  ARCHIVO: pedidos.html
  CAPA: FRONTEND (estructura). ¿ES CASCARÓN? SÍ en lo visual (HTML + CSS), pero el sidebar, la barra
    superior y las filas de la tabla las dibuja JavaScript: sin JS la página sale casi vacía.
  BACKEND: pedidos, lotes asignados y estado de entrega en /api/pedidos.
-->
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pedidos - Gestión de Cultivos</title>
    <link rel="stylesheet" href="../css/admin.css">
    <link rel="stylesheet" href="../css/admin-vistas.css">
    <link rel="stylesheet" href="../css/pedidos.css">
</head>
<body class="admin">
    <div class="app-admin">
        <aside id="sidebar" class="sidebar-admin" data-activo="pedidos"></aside>

        <div class="contenido-admin">
            <header id="topbar" class="topbar-admin" data-placeholder="Buscar por cliente o número de pedido" data-local="true"></header>

            <main class="pagina">
                <div class="encabezado-pagina">
                    <div>
                        <h1>Pedidos y entregas</h1>
                        <p>Consulta pedidos, prepara las solicitudes pendientes y actualiza el envío, rastreo o recolección.</p>
                    </div>
                </div>

                <div id="filtros-estado" class="barra-herramientas" role="group" aria-label="Filtrar por estado">
                    <button class="filtro" type="button" data-valor="todos" aria-pressed="true">Todos</button>
                    <button class="filtro" type="button" data-valor="pendiente" aria-pressed="false">Pendientes</button>
                    <button class="filtro" type="button" data-valor="en_transito" aria-pressed="false">Enviados</button>
                    <button class="filtro" type="button" data-valor="listo_recoleccion" aria-pressed="false">Listos para recoger</button>
                    <button class="filtro" type="button" data-valor="entregado" aria-pressed="false">Entregados</button>
                    <button class="filtro" type="button" data-valor="cancelado" aria-pressed="false">Cancelados</button>
                </div>

                <p id="mensaje-pedidos" class="mensaje" role="status"></p>
                <section aria-label="Lista de pedidos">
                    <div class="envoltura-tabla">
                        <table class="tabla-pedidos">
                            <thead>
                                <tr>
                                    <th>Pedido</th>
                                    <th>Cliente</th>
                                    <th>Fecha</th>
                                    <th>Lotes asignados</th>
                                    <th>Entrega</th>
                                    <th>Estado</th>
                                    <th><span class="solo-lectores">Detalle</span></th>
                                </tr>
                            </thead>
                            <tbody id="lista-pedidos"></tbody>
                        </table>
                    </div>
                </section>
            </main>
        </div>
    </div>

    <script src="../js/sidebar.js"></script>
    <script src="../js/admin-comun.js"></script>
    <script src="../js/pedidos.js"></script>
</body>
</html>
