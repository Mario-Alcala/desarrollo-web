server:
  port: ${SERVER_PORT:8081}

spring:
  application:
    name: gestioncultivos-backend
  profiles:
    default: local
  datasource:
    url: jdbc:h2:file:./data/gestion_cultivos;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
  sql:
    init:
      mode: always
      schema-locations: classpath:cliente-schema.sql
app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://127.0.0.1:3000,http://localhost:5500,http://127.0.0.1:5500,http://localhost:5501,http://127.0.0.1:5501}
