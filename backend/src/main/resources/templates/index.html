<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${titulo}">Gestión de Cultivos - API REST</title>
    <style>
        body {
            font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
            max-width: 720px;
            margin: 3rem auto;
            padding: 0 1rem;
            color: #1f2d1f;
            background: #f4f8f1;
        }
        h1 { color: #2e6b2e; }
        code {
            background: #e4eedd;
            padding: 0.15rem 0.4rem;
            border-radius: 4px;
        }
        li { margin: 0.4rem 0; }
        .estado { color: #2e6b2e; font-weight: 600; }
    </style>
</head>
<body>
    <h1 th:text="${titulo}">Gestión de Cultivos - API REST</h1>
    <p class="estado">El backend está en línea.</p>

    <h2>Endpoints disponibles</h2>
    <ul>
        <li th:each="endpoint : ${endpoints}">
            <code th:text="${endpoint}">GET /api/cultivos</code>
        </li>
    </ul>

    <p>
        Prueba rápida:
        <a href="/api/cultivos">/api/cultivos</a> ·
        <a href="/api/semillas">/api/semillas</a> ·
        <a href="/api/terrenos">/api/terrenos</a> ·
        <a href="/api/herramientas">/api/herramientas</a>
    </p>
</body>
</html>
